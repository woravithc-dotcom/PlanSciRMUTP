<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Slideshow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background-color: #0f172a; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      overflow: hidden; 
      touch-action: pan-y; /* ป้องกันการซูมหรือดึงหน้าจอผิดพลาด */
    }
    .slide-wrapper {
      position: relative;
      width: 90vw;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .slide {
      display: none;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      user-select: none;
      -webkit-user-drag: none;
    }
    .slide.active { display: block; }
    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 16px 20px;
      cursor: pointer;
      font-size: 24px;
      border-radius: 50%;
      transition: background 0.2s;
      user-select: none;
      z-index: 10; /* เพิ่ม z-index ให้ปุ่มอยู่ชั้นบนสุดเสมอ */
    }
    .btn:hover { background: rgba(255, 255, 255, 0.5); }
    .prev { left: 20px; }
    .next { right: 20px; }
    .counter {
      margin-top: 20px;
      font-size: 16px;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="slide-wrapper" id="slideWrapper">
    <img class="slide active" src="ScP1.png" alt="Slide 1">
    <img class="slide" src="ScP2.png" alt="Slide 2">
    <img class="slide" src="ScP3.png" alt="Slide 3">
    <img class="slide" src="ScP4.png" alt="Slide 4">
    <img class="slide" src="ScP5.png" alt="Slide 5">
    <img class="slide" src="ScP6.png" alt="Slide 6">
    <img class="slide" src="ScP7.jpg" alt="Slide 7">
    <img class="slide" src="ScP8.jpg" alt="Slide 8">
    <img class="slide" src="ScP9.jpg" alt="Slide 9">
    <img class="slide" src="ScP10.jpg" alt="Slide 10">
    <img class="slide" src="ScP11.png" alt="Slide 11">
    <img class="slide" src="ScP12.png" alt="Slide 12">
    <img class="slide" src="ScP13.png" alt="Slide 13">
    <img class="slide" src="ScP14.jpg" alt="Slide 14">
    <img class="slide" src="ScP15.png" alt="Slide 15">

    <button class="btn prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="btn next" onclick="changeSlide(1)">&#10095;</button>
  </div>

  <div class="counter" id="slideCounter">1 / 15</div>

  <script>
    let currentIndex = 0;
    const slides = document.querySelectorAll('.slide');
    const counter = document.getElementById('slideCounter');
    const slideWrapper = document.getElementById('slideWrapper');

    function updateSlide(index) {
      if (index >= slides.length) currentIndex = 0;
      else if (index < 0) currentIndex = slides.length - 1;
      else currentIndex = index;

      slides.forEach(slide => slide.classList.remove('active'));
      slides[currentIndex].classList.add('active');
      counter.textContent = `${currentIndex + 1} / ${slides.length}`;
    }

    function changeSlide(step) {
      updateSlide(currentIndex + step);
    }

    // คีย์บอร์ด
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') changeSlide(1);
      if (e.key === 'ArrowLeft') changeSlide(-1);
    });

    // ระบบตรวจจับการปัดนิ้ว (Touch Swipe) สำหรับมือถือ
    let touchStartX = 0;
    let touchEndX = 0;

    slideWrapper.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    slideWrapper.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      const minSwipeDistance = 40; // ระยะปัดขั้นต่ำ (px)
      if (touchEndX < touchStartX - minSwipeDistance) {
        changeSlide(1);  // ปัดซ้าย -> ไปสไลด์ถัดไป
      }
      if (touchEndX > touchStartX + minSwipeDistance) {
        changeSlide(-1); // ปัดขวา -> ย้อนกลับ
      }
    }

    // อัปเดตตัวเลขเริ่มต้นให้ตรงตามจำนวนสไลด์จริง
    updateSlide(0);
  </script>
</body>
</html>
