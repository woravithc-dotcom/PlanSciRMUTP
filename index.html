<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Presentation Slideshow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background-color: #0f172a; 
      color: #fff; 
      font-family: system-ui, -apple-system, sans-serif; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      overflow: hidden; 
      touch-action: none; /* ป้องกันการเลื่อนหน้าเว็บของเบราว์เซอร์ */
    }
    .slide-wrapper {
      position: relative;
      width: 90vw;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* ซ่อนส่วนเกินเมื่อขยายรูป */
    }
    .slide {
      display: none;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: center center;
      will-change: transform;
    }
    .slide.active { display: block; }
    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 16px 20px;
      cursor: pointer;
      font-size: 24px;
      border-radius: 50%;
      transition: background 0.2s;
      user-select: none;
      z-index: 10;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.5); }
    .prev { left: 20px; }
    .next { right: 20px; }
    .counter {
      margin-top: 20px;
      font-size: 16px;
      letter-spacing: 1px;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="slide-wrapper" id="slideWrapper">
    <img class="slide active" src="ScP1.png" alt="Slide 1">
    <img class="slide" src="ScP2.png" alt="Slide 2">
    <img class="slide" src="ScP3.png" alt="Slide 3">
    <img class="slide" src="ScP4.png" alt="Slide 4">
    <img class="slide" src="ScP5.png" alt="Slide 5">
    <img class="slide" src="ScP6.png" alt="Slide 6">
    <img class="slide" src="ScP7.jpg" alt="Slide 7">
    <img class="slide" src="ScP8.jpg" alt="Slide 8">
    <img class="slide" src="ScP9.jpg" alt="Slide 9">
    <img class="slide" src="ScP10.jpg" alt="Slide 10">
    <img class="slide" src="ScP11.png" alt="Slide 11">
    <img class="slide" src="ScP12.png" alt="Slide 12">
    <img class="slide" src="ScP13.png" alt="Slide 13">
    <img class="slide" src="ScP14.jpg" alt="Slide 14">
    <img class="slide" src="ScP15.png" alt="Slide 15">

    <button class="btn prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="btn next" onclick="changeSlide(1)">&#10095;</button>
  </div>

  <div class="counter" id="slideCounter">1 / 15</div>

  <script>
    let currentIndex = 0;
    const slides = document.querySelectorAll('.slide');
    const counter = document.getElementById('slideCounter');
    const slideWrapper = document.getElementById('slideWrapper');

    // ตัวแปรสำหรับย่อ-ขยาย และ ลากรูป
    let scale = 1;
    let currentX = 0;
    let currentY = 0;
    let initialDistance = 0;
    let startScale = 1;
    let panStartX = 0;
    let panStartY = 0;
    let isPinching = false;
    let touchStartX = 0;
    let touchEndX = 0;
    let lastTap = 0;

    function resetZoom() {
      scale = 1;
      currentX = 0;
      currentY = 0;
      slides.forEach(s => {
        s.style.transition = 'transform 0.2s ease-out';
        s.style.transform = 'none';
      });
    }

    function updateSlide(index) {
      resetZoom(); // รีเซ็ตการซูมทุกครั้งที่เปลี่ยนหน้า

      if (index >= slides.length) currentIndex = 0;
      else if (index < 0) currentIndex = slides.length - 1;
      else currentIndex = index;

      slides.forEach(slide => slide.classList.remove('active'));
      slides[currentIndex].classList.add('active');
      counter.textContent = `${currentIndex + 1} / ${slides.length}`;
    }

    function changeSlide(step) {
      updateSlide(currentIndex + step);
    }

    // เลื่อนด้วย คีย์บอร์ด
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') changeSlide(1);
      if (e.key === 'ArrowLeft') changeSlide(-1);
    });

    // คำนวณระยะห่างระหว่าง 2 นิ้ว
    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    // Touch Event Handlers
    slideWrapper.addEventListener('touchstart', (e) => {
      const activeSlide = slides[currentIndex];
      activeSlide.style.transition = 'none';

      if (e.touches.length === 2) {
        // เริ่มใช้ 2 นิ้วย่อ-ขยาย
        isPinching = true;
        initialDistance = getDistance(e.touches);
        startScale = scale;
      } else if (e.touches.length === 1) {
        isPinching = false;
        if (scale > 1) {
          // เริ่มลากรูปเมื่อมีการขยาย
          panStartX = e.touches[0].clientX - currentX;
          panStartY = e.touches[0].clientY - currentY;
        } else {
          // เก็บพิกัดไว้สำหรับเปลี่ยนสไลด์
          touchStartX = e.touches[0].clientX;
        }
      }
    }, { passive: false });

    slideWrapper.addEventListener('touchmove', (e) => {
      const activeSlide = slides[currentIndex];

      if (e.touches.length === 2 && isPinching) {
        e.preventDefault();
        const currentDistance = getDistance(e.touches);
        if (initialDistance > 0) {
          scale = startScale * (currentDistance / initialDistance);
          scale = Math.min(Math.max(1, scale), 4); // จำกัดการซูมระหว่าง 1x ถึง 4x
          activeSlide.style.transform = `translate(${currentX}px, ${currentY}px) scale(${scale})`;
        }
      } else if (e.touches.length === 1 && !isPinching && scale > 1) {
        e.preventDefault();
        // ลากรูปเมื่อขยายอยู่
        currentX = e.touches[0].clientX - panStartX;
        currentY = e.touches[0].clientY - panStartY;
        activeSlide.style.transform = `translate(${currentX}px, ${currentY}px) scale(${scale})`;
      }
    }, { passive: false });

    slideWrapper.addEventListener('touchend', (e) => {
      const activeSlide = slides[currentIndex];
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;

      if (e.touches.length < 2) {
        isPinching = false;
      }

      if (e.touches.length === 0) {
        // ระบบ Double Tap (แตะ 2 ครั้งติดกันเพื่อย่อ/ขยาย)
        if (tapLength < 300 && tapLength > 0) {
          activeSlide.style.transition = 'transform 0.25s ease';
          if (scale > 1) {
            resetZoom();
          } else {
            scale = 2.5;
            currentX = 0;
            currentY = 0;
            activeSlide.style.transform = `translate(0px, 0px) scale(2.5)`;
          }
          lastTap = 0;
          return;
        }
        lastTap = currentTime;

        // คืนค่าหากย่อรูปเล็กกว่าขนาดปกติ
        if (scale <= 1) {
          resetZoom();
          touchEndX = e.changedTouches[0].clientX;
          handleSwipe();
        }
      }
    });

    function handleSwipe() {
      const minSwipeDistance = 40;
      if (touchEndX < touchStartX - minSwipeDistance) {
        changeSlide(1);  // ปัดซ้าย -> ไปข้างหน้า
      } else if (touchEndX > touchStartX + minSwipeDistance) {
        changeSlide(-1); // ปัดขวา -> ย้อนกลับ
      }
    }

    // เริ่มต้นแสดงผล
    updateSlide(0);
  </script>
</body>
</html>
